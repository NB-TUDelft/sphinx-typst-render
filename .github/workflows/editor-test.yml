# Tests the editor in a real browser (tools/editor_test.py). It builds a
# small Sphinx site, opens the worksheet in the editor with Playwright, fills
# it in, exports it, opens the export again and checks nothing was lost.
# Screenshots and a report.md are uploaded as an artifact. Runs on pull
# requests that touch the editor, by hand from the Actions tab, and when
# another workflow calls it. There is no timed run.
name: editor test
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'editor/**'
      - 'tools/editor_test.py'
      - '.github/workflows/editor-test.yml'

jobs:
  editor-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # pnpm at the version packageManager in editor/package.json names.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: editor/package.json
          cache: true
          cache_dependency_path: editor/pnpm-lock.yaml

      - run: cd editor && pnpm install --frozen-lockfile && pnpm run check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - run: python tools/editor_test.py
      # Keep the screenshots and report even when the test fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-test
          path: editor-test/
