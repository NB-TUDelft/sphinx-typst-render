sonar.projectKey=sphinx-typst-render
sonar.projectName=sphinx-typst-render
# Advance with each release (RELEASING.md): SonarQube's "Previous version"
# new-code period starts at the analysis where this last changed.
sonar.projectVersion=1.1.1
sonar.sourceEncoding=UTF-8

sonar.sources=src,editor/src,editor/build.mjs,editor/coverage.mjs,tools,docs/kb/housekeeping.py
sonar.tests=tests

# The editor bundle in src/sphinx_typst_render/_editor/ is generated from
# editor/ by `pnpm run build`; analyse the source, not the output.
sonar.exclusions=src/sphinx_typst_render/_editor/**,**/node_modules/**,**/__pycache__/**,dist/**,.venv/**,editor-test/**

sonar.python.version=3.10,3.11,3.12,3.13,3.14,3.15
sonar.python.coverage.reportPaths=coverage.xml
# The editor's coverage comes from its browser test: `pnpm run coverage` in
# editor/ (editor/coverage.mjs).
sonar.javascript.lcov.reportPaths=editor/coverage/lcov.info

# Build, coverage and test tooling, with no tests of its own. The download
# menu's script (static/) is not under any test yet.
sonar.coverage.exclusions=editor/build.mjs,editor/coverage.mjs,tools/**,src/sphinx_typst_render/static/**
