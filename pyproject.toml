[project]
name = "sphinx-typst-render"
version = "0.2.2"
description = "Render Typst sources into downloadable PDFs and inline previews in Sphinx and Jupyter Book."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NB-TUDelft" },
    { name = "K.Zabłocki (Zamkorus)" },
]
keywords = ["jupyter-book", "sphinx", "typst", "pdf", "forms", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "sphinx>=7",
    "typst>=0.15",
    "typst-fillable>=0.0.1",
]

[project.urls]
Homepage = "https://github.com/NB-TUDelft/sphinx-typst-render"
Repository = "https://github.com/NB-TUDelft/sphinx-typst-render"
Issues = "https://github.com/NB-TUDelft/sphinx-typst-render/issues"
Changelog = "https://github.com/NB-TUDelft/sphinx-typst-render/releases"

[dependency-groups]
dev = [
    "pytest>=8",
    "twine>=6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sphinx_typst_render = ["static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[project.scripts]
sphinx-typst-render = "sphinx_typst_render:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

# Consumed by NB-TUDelft/actions/python-publish, which renders the conda
# recipe from the metadata above so the conda package can never drift from the
# PyPI one. Only what conda needs and pyproject cannot express lives here.
#
# Conda publishing is currently disabled in .github/workflows/publish.yml.
# Two dependencies block it: typst (the Python binding) and typst-fillable are
# both PyPI only. conda-forge ships a `typst` package, but that is the Rust CLI
# and does not provide the importable module, so mapping to it would be wrong.
[tool.conda-recipe]
# The package itself is pure Python, so a single noarch build serves every
# architecture and every Python >=3.10.
noarch = true
build-channels = ["conda-forge"]
maintainers = ["NB-TUDelft", "Zamkorus"]
test-imports = [
    "sphinx_typst_render",
]
# PyPI project name -> conda-forge package name, where the two differ.
name-map = {}
# Escape hatch keyed by normalized PyPI name: replaces the auto-translated
# spec outright. Use when a requirement carries an environment marker or
# extras, which conda's dependency syntax cannot express.
requirement-overrides = {}
# Run-time requirements that apply only to the conda package.
extra-run = []
